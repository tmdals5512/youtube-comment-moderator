[pytest]
testpaths = tests
pythonpath = .
# 수집기 테스트가 async 라서 필요. 데코레이터 없이 async def 테스트가 돈다.
asyncio_mode = auto

# 이벤트 루프를 테스트마다 새로 만들면, 모듈 수준에 하나뿐인 DB 엔진이
# 첫 루프에 묶인 커넥션을 들고 있다가 'Event loop is closed' 로 죽는다.
# 루프를 세션 단위로 하나만 쓰면 엔진과 수명이 맞는다.
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session
