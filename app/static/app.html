<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outlier — 댓글 관리</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- 사이드바. 온보딩 화면(시안)과 같은 껍데기라 넘어와도 화면이 이어진다. -->
<aside>
  <div class="logo">
    <svg width="22" height="22" viewBox="0 0 26 26">
      <circle cx="6" cy="8" r="2.4" fill="#66638a"/>
      <circle cx="12" cy="6" r="2.4" fill="#66638a"/>
      <circle cx="7" cy="15" r="2.4" fill="#66638a"/>
      <circle cx="14" cy="14" r="2.4" fill="#66638a"/>
      <circle cx="21" cy="21" r="3.4" fill="#8f7ef5"/>
    </svg>
    <span>Outlier</span>
  </div>

  <a class="nav-item" href="#/dashboard">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    대시보드
  </a>
  <!-- 채널 관리는 아직 온보딩 목업 화면이다. 목업 사이드바에는 이 항목이
       있는데 여기에 없으면, 목업에서 넘어온 사람이 돌아갈 길을 잃는다. -->
  <a class="nav-item" href="#/channels" title="연동된 채널 관리">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5l5 2.5-5 2.5z" fill="currentColor" stroke="none"/></svg>
    채널 관리
  </a>
  <a class="nav-item" href="#/queue">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
    검토 큐 <b id="badge"></b>
  </a>
  <a class="nav-item" href="#/hidden">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
    숨김 목록 <b id="badge-hidden"></b>
  </a>
  <a class="nav-item" href="#/rules">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2" fill="#121127"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="16" cy="12" r="2" fill="#121127"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="11" cy="18" r="2" fill="#121127"/></svg>
    관리 기준
  </a>
  <a class="nav-item" href="#/history">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>
    처리 이력
  </a>

  <div class="spacer"></div>

  <a class="nav-item" href="/" title="온보딩 화면부터 다시 보기">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
    처음부터
  </a>
  <div class="me" id="me">
    <div class="av" id="me-av">·</div>
    <div>
      <div class="n" id="me-name">불러오는 중</div>
      <div class="t" id="me-ws">&nbsp;</div>
    </div>
  </div>
</aside>

<div class="body">
  <div class="topbar">
    <select id="channel"></select>
  </div>
  <main id="view"></main>
</div>

<div class="toast" id="toast"></div>

<script src="/static/app.js"></script>
</body>
</html>
