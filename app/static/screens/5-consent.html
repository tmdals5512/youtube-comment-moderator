<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'IBM Plex Sans KR', 'Malgun Gothic', sans-serif; }
  .nav-item { display:flex; align-items:center; gap:11px; padding:9px 14px; border-radius:8px; font-size:13.5px; font-weight:500; }
  .rule-row { display:flex; gap:12px; align-items:flex-start; padding:10px 0; }
</style>
</helmet>

<div style="width:1440px; height:900px; background:#f7f7fa; display:flex; position:relative;">

  <!-- dimmed background app shell -->
  <div style="width:240px; min-width:240px; height:900px; background:#121127; opacity:0.5;"></div>
  <div style="flex:1; background:#f7f7fa; opacity:0.5;"></div>

  <!-- dim overlay -->
  <div style="position:absolute; inset:0; background:rgba(10,9,20,0.55);"></div>

  <!-- modal -->
  <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:520px; background:#ffffff; border-radius:16px; box-shadow:0 30px 70px rgba(0,0,0,0.4); overflow:hidden;">

    <div style="padding:28px 28px 8px;">
      <div style="width:46px; height:46px; border-radius:12px; background:#efecfd; display:flex; align-items:center; justify-content:center; margin-bottom:16px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5b47e0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V6z"/><polyline points="9 12 11 14 15 10"/></svg>
      </div>
      <h2 style="margin:0 0 8px; font-size:19px; font-weight:700; color:#17171f;">AI 자동 모더레이션 동의</h2>
      <p style="margin:0 0 4px; font-size:13.5px; line-height:1.65; color:#6b6b78;">Outlier는 연동한 채널의 댓글을 자동으로 수집·분석하고, 설정한 기준에 따라 숨김 처리를 제안하거나 직접 실행할 수 있어요.</p>
    </div>

    <div style="margin:14px 28px 0; padding:16px 18px; background:#fafafc; border:1px solid #eeeef2; border-radius:12px;">
      <div class="rule-row">
        <div style="width:18px; height:18px; min-width:18px; margin-top:1px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b47e0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <span style="font-size:13px; line-height:1.5; color:#3a3a44;">댓글을 자동 수집하고 유해성을 분석해요</span>
      </div>
      <div class="rule-row">
        <div style="width:18px; height:18px; min-width:18px; margin-top:1px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b47e0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <span style="font-size:13px; line-height:1.5; color:#3a3a44;">위험도가 높은 댓글은 관리자 검토 후 처리해요</span>
      </div>
      <div class="rule-row">
        <div style="width:18px; height:18px; min-width:18px; margin-top:1px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b47e0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <span style="font-size:13px; line-height:1.5; color:#3a3a44;">채널별 차단 기준은 언제든 직접 바꿀 수 있어요</span>
      </div>
    </div>

    <div style="margin:18px 28px 0; display:flex; align-items:flex-start; gap:10px;">
      <div style="width:18px; height:18px; min-width:18px; margin-top:1px; border-radius:5px; background:#5b47e0; display:flex; align-items:center; justify-content:center;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <span style="font-size:12.5px; line-height:1.6; color:#3a3a44;">AI 자동 분석 및 조치 실행에 동의합니다. <a href="#" style="color:#5b47e0;">이용약관 전문 보기</a></span>
    </div>

    <div style="display:flex; gap:10px; padding:24px 28px 28px;">
      <button style="flex:1; height:46px; background:#ffffff; border:1px solid #dcdce4; border-radius:10px; color:#3a3a44; font-size:14px; font-weight:600; cursor:pointer;">취소</button>
      <button style="flex:2; height:46px; background:#5b47e0; border:none; border-radius:10px; color:#ffffff; font-size:14px; font-weight:600; cursor:pointer;">동의하고 연동 완료</button>
    </div>
  </div>
</div>
</x-dc>

<script>
/* 시안을 클릭해 넘길 수 있게 붙인 얇은 이동 스크립트. 디자인은 손대지 않는다.
   버튼/링크는 텍스트만 맞으면 잡고, div·span 은 잎사귀 수준일 때만 잡는다
   (텍스트가 같은 큰 컨테이너를 실수로 잡지 않으려고). */
(function () {
  var NEXT = "/onboarding/6", CTA = "\ub3d9\uc758\ud558\uace0 \uc5f0\ub3d9 \uc644\ub8cc", NAV = {"대시보드":"/app#/dashboard","채널 관리":"/app#/queue","관리 기준":"/app#/rules","처리 이력":"/app#/history","설정":"/app#/rules"};
  function go(url) { return function (e) { e.preventDefault(); e.stopPropagation(); location.href = url; }; }
  function bind(el, url) { el.style.cursor = "pointer"; el.addEventListener("click", go(url)); }

  var all = document.querySelectorAll("button,a,div,span");
  var found = 0;
  for (var i = 0; i < all.length; i++) {
    var el = all[i], tag = el.tagName.toLowerCase();
    var t = (el.textContent || "").replace(/\s+/g, " ").trim();
    var leafish = tag === "button" || tag === "a" || el.children.length <= 1;
    if (!leafish) continue;
    if (t === CTA) { bind(el, NEXT); found++; }
    else if (NAV[t]) { bind(el, NAV[t]); }
  }
  // 버튼을 못 찾았으면 프로토타입이 막힌다. 눈에 보이는 안내를 띄운다.
  if (!found) {
    var b = document.createElement("div");
    b.textContent = "다음 →";
    b.style.cssText = "position:fixed;right:22px;bottom:22px;background:#17171f;color:#fff;" +
      "padding:12px 20px;border-radius:10px;font:600 14px system-ui;cursor:pointer;z-index:9999";
    b.onclick = function () { location.href = NEXT; };
    document.body.appendChild(b);
  }
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === "ArrowRight") location.href = NEXT;
  });
})();
</script>


<script>
/* 시연용 선택 표시. 실제 동의 기록은 channels.ai_consent_agreed 에 들어가야 한다. */
(function () {
  var CHECK = "<svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"/></svg>".replace(/13/g, "12");
  var box = null, ds = document.getElementsByTagName("div");
  for (var i = 0; i < ds.length; i++) {
    if ((ds[i].getAttribute("style") || "").indexOf("width:18px") >= 0) { box = ds[i]; break; }
  }
  if (!box) return;
  var on = true, host = box.parentNode;
  host.style.cursor = "pointer";
  host.addEventListener("click", function () {
    on = !on;
    var cur = host.getElementsByTagName("div")[0];
    cur.outerHTML = on
      ? '<div style="width:18px; height:18px; min-width:18px; margin-top:1px; border-radius:5px;' +
        ' background:#5b47e0; display:flex; align-items:center; justify-content:center;">' + CHECK + "</div>"
      : '<div style="width:18px; height:18px; min-width:18px; margin-top:1px; border-radius:5px;' +
        ' border:1.6px solid #d4d4de;"></div>';
  });
})();
</script>
</body>
</html>
